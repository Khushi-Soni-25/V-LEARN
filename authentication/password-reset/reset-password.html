<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — V-LEARN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reset-password.css">
</head>
<body>

  <main class="stage">

    <section class="mascot" aria-label="V-LEARN mascot">
      <div class="mascot__frame">
        <img
          class="mascot__image"
          src="../../assets/fox-mascot.png"
          alt="Vixie the fox, V-LEARN's mascot, smiling and waving hello in a purple hoodie"
          width="420"
          height="756"
        >
      </div>
    </section>

    <header class="brand">
      <span class="brand__name">V-LEARN</span>
      <p class="brand__tagline">Unlock your potential.</p>
    </header>

    <section class="entry" aria-labelledby="reset-heading">
      <h1 id="reset-heading" class="entry__heading">Set a new password</h1>
      <p class="entry__subtext">Choose a password with at least 8 characters.</p>

      <form id="reset-form" class="reset-form" novalidate>
        <div class="field">
          <label for="new-password" class="field__label">New password</label>
          <div class="field__password-wrap">
            <input
              type="password"
              id="new-password"
              name="new_password"
              class="field__input"
              placeholder="Enter new password"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              id="toggle-password"
              class="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >Show</button>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password" class="field__label">Confirm password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm_password"
            class="field__input"
            placeholder="Re-enter new password"
            autocomplete="new-password"
            required
          >
        </div>

        <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

        <button type="submit" id="reset-submit" class="submit-btn">Update password</button>
      </form>
    </section>

    <p class="nav-link" id="context-link"></p>

    <p class="back-link">
      <a href="../../landing/index.html">&larr; Back to landing page</a>
    </p>

  </main>

  <script src="reset-password.js"></script>
</body>
</html>

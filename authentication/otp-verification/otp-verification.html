<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP — V-LEARN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="otp-verification.css">
</head>
<body>

  <main class="stage">

    <section class="mascot" aria-label="V-LEARN mascot">
      <div class="mascot__frame">
        <img
          class="mascot__image"
          src="../../assets/fox-mascot.png"
          alt="Vixie the fox, V-LEARN's mascot, smiling and waving hello in a purple hoodie"
          width="420"
          height="756"
        >
      </div>
    </section>

    <header class="brand">
      <span class="brand__name">V-LEARN</span>
      <p class="brand__tagline">Unlock your potential.</p>
    </header>

    <section class="entry" aria-labelledby="otp-heading">
      <h1 id="otp-heading" class="entry__heading">Verify OTP</h1>
      <p class="entry__subtext" id="phone-hint">Enter the code we sent you.</p>

      <form id="otp-form" class="otp-form" novalidate>
        <div class="field">
          <label for="otp" class="field__label">6-digit code</label>
          <input
            type="text"
            id="otp"
            name="otp"
            class="field__input field__input--otp"
            placeholder="000000"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            required
          >
        </div>

        <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

        <button type="submit" id="verify-btn" class="submit-btn">Verify</button>

        <button type="button" id="resend-btn" class="resend-btn">Resend OTP</button>
      </form>
    </section>

    <p class="nav-link" id="context-link"></p>

    <p class="back-link">
      <a href="../../landing/index.html">&larr; Back to landing page</a>
    </p>

  </main>

  <script src="otp-verification.js"></script>
</body>
</html>

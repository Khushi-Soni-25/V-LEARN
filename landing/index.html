<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-LEARN — Unlock Your Potential</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
  <style>
/* ============================================================
   V-LEARN — landing page
   Reference: WePlay sign-in screen (clean white canvas, pill
   buttons, top-right Help, bottom legal line).

   Tokens
   background   #FFFFFF
   surface      #FFFFFF
   ink          #241E3D  (deep indigo-black, not pure black)
   ink-soft     #8A8599
   indigo       #4338CA  (brand mark, primary button)
   violet       #7C3AED  (focus ring)
   cyan         #0FB5CE  (phone icon accent)
   line         #E7E5EF  (button borders/hairlines)

   Type
   display  "Baloo 2"  — rounded, friendly, carries the brand
   body     "Inter"    — quiet workhorse for everything else
   ============================================================ */

:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #241E3D;
  --ink-soft: #8A8599;
  --indigo: #4338CA;
  --violet: #7C3AED;
  --cyan: #0FB5CE;
  --line: #E7E5EF;

  --font-display: "Baloo 2", ui-rounded, system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;

  --radius-pill: 999px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  width: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  width: 100%;
  max-width: 100vw;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow-x: hidden;
}

/* ---------- top-right help ---------- */

.help-link {
  position: fixed;
  top: 20px;
  right: 24px;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--ink-soft);
  text-decoration: none;
  z-index: 2;
}

.help-link:hover,
.help-link:focus-visible {
  color: var(--ink);
}

/* ---------- page stage ---------- */

.stage {
  position: relative;
  min-height: 100dvh;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6vh 24px 20px;
  text-align: center;
}

/* mascot sits near the upper-middle section */
.mascot {
  margin-bottom: 8px;
}

.mascot__frame {
  width: clamp(150px, 42vw, 200px);
  height: clamp(150px, 42vw, 200px);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.mascot__image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 12px 16px rgba(67, 56, 202, 0.14));
}

/* ---------- brand ---------- */

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 24px;
}

.brand__name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2rem, 5vw, 2.5rem);
  letter-spacing: 0.5px;
  color: var(--indigo);
  line-height: 1;
}

.brand__name::before {
  content: "V";
  color: var(--cyan);
}

.brand__tagline {
  margin: 10px 0 0;
  font-size: 0.95rem;
  color: var(--ink-soft);
  font-weight: 500;
}

/* ---------- entry / login options ---------- */

.entry {
  width: 100%;
  max-width: 400px;
}

.entry__options {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.login-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 14px 22px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

.login-btn:hover,
.login-btn:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(36, 30, 61, 0.08);
}

.login-btn:focus-visible {
  outline: none;
  border-color: var(--violet);
}

.login-btn__icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  font-size: 1.2rem;
  line-height: 1;
}

.login-btn__text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.login-btn__label {
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.login-btn__sub {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-soft);
}

.login-btn--vid {
  background: var(--indigo);
  border-color: var(--indigo);
}

.login-btn--vid .login-btn__label {
  color: #FFFFFF;
}

.login-btn--vid .login-btn__sub {
  color: rgba(255, 255, 255, 0.75);
}

.login-btn--phone .login-btn__icon {
  color: var(--cyan);
}

/* ---------- registration & legal ---------- */

.register {
  margin: 18px 0 0;
  font-size: 0.9rem;
  color: var(--ink-soft);
}

.register__link {
  color: var(--indigo);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 2px solid rgba(67, 56, 202, 0.3);
  padding-bottom: 1px;
  transition: border-color 0.15s ease;
}

.register__link:hover,
.register__link:focus-visible {
  border-color: var(--indigo);
}

.legal {
  margin: 20px 0 0;
  font-size: 0.78rem;
  color: var(--ink-soft);
  max-width: 340px;
  line-height: 1.5;
}

.legal__link {
  color: var(--ink-soft);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.legal__link:hover,
.legal__link:focus-visible {
  color: var(--ink);
}

/* ---------- small screens ---------- */

@media (max-width: 380px) {
  .login-btn {
    padding: 12px 18px;
  }
  .login-btn__label {
    font-size: 0.88rem;
  }
}

  </style>
</head>
